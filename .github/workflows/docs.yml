name: Docs

# Builds the documentation site from docs/ on every push, and publishes it to GitHub Pages from
# master once publication has been turned on.
#
# Separate from ci.yml on the argument that it answers a different question and should fail with its
# own name. "Docs — build failed" says a doc comment or a guide stopped compiling into a page; a red
# step inside CI would say "CI failed" and send somebody to the test output.
#
# The site is a build artifact. There is no gh-pages branch and no committed _site — a generated
# directory in version control is a merge conflict waiting for the next doc-comment fix.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Docs — build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Superseded branch runs are cancelled; master is exempt, because its runs are the record for a
    # merged commit and feed a deployment that must not be cut off half-way.
    concurrency:
      group: docs-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

    steps:
      - uses: actions/checkout@v4

      # global.json pins the SDK feature band, so the runner and a developer's machine resolve the
      # same compiler — which matters here: DocFX reads the doc comments through the compiler it is
      # given.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # DocFX is pinned at 2.78.5 in .config/dotnet-tools.json with rollForward: false, so this
      # restores that exact version rather than whatever is newest. The site's layout and the
      # generated YAML schema are both version-dependent; an unpinned tool would redesign the
      # published site on somebody else's release schedule.
      - name: Restore DocFX
        run: dotnet tool restore

      # DocFX loads the two shipping projects through MSBuildWorkspace to read their doc comments, so
      # their dependencies have to be on disk first. docfx would restore them itself, but doing it
      # here means a restore failure is reported as a restore failure.
      - name: Restore projects
        run: dotnet restore IbkrDotNet.slnx

      # `docfx docs/docfx.json` — not `docfx build` — because that form runs the metadata stage as
      # well. It has to: docs/api/*.yml is gitignored, so on a fresh checkout the reference YAML does
      # not exist and `build` alone would publish a site with an empty API section.
      #
      # --warningsAsErrors matches TreatWarningsAsErrors in the build proper. A DocFX warning is
      # almost always a link that will not resolve — a README section renamed, a guide moved — which
      # on a published site is a dead link nobody reports.
      - name: Build the site
        run: dotnet docfx docs/docfx.json --warningsAsErrors

      - name: Upload the site
        if: github.ref == 'refs/heads/master' && vars.PUBLISH_DOCS == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  # Gated on the PUBLISH_DOCS repository variable, because this repository is private and turning
  # Pages on would publish its documentation at a public URL. That is a decision to make on purpose,
  # not a side effect of merging this workflow. To turn it on:
  #
  #   gh api -X POST repos/jerbersoft/ibkrdotnet/pages -f build_type=workflow
  #   gh variable set PUBLISH_DOCS --body true
  #
  # Until then the site is still built on every push, which is where the value is: a broken
  # cross-reference is cheapest to fix at the push that broke it.
  #
  # Never from a pull request, and never from a branch. A fork's PR must not be able to publish to
  # the live site, and even a trusted branch should not: what is deployed is what landed on master.
  deploy:
    name: Docs — deploy
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.PUBLISH_DOCS == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write       # to publish the deployment
      id-token: write    # for the OIDC token deploy-pages exchanges for one

    # One deployment at a time, and queued rather than cancelled. cancel-in-progress: true is the
    # usual choice and it is wrong for a deploy: killing a half-finished upload to leap to a newer
    # commit can leave the live site on neither. Two pushes a minute apart should publish in order.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
